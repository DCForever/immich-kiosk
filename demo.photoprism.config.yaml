# Demo-style config for the kiosk with PhotoPrism.
# Use by copying to config.yaml and setting photoprism_url and photoprism_token
# (or set KIOSK_PHOTOPRISM_URL and KIOSK_PHOTOPRISM_TOKEN).
#
#   cp demo.photoprism.config.yaml config.yaml
#   # Edit config.yaml: set photoprism_url and photoprism_token
#   go run .
#
# Or run with demo.config.yaml replaced by this file and KIOSK_DEMO_MODE=1.

# yaml-language-server: $schema=https://raw.githubusercontent.com/damongolding/immich-kiosk/main/config.schema.json

source: photoprism
photoprism_url: "http://localhost:2342"   # Your PhotoPrism URL (or set KIOSK_PHOTOPRISM_URL)
photoprism_token: ""                      # App password / API token from PhotoPrism Settings → Account (or set KIOSK_PHOTOPRISM_TOKEN)

# Clock
show_time: true
time_format: 12 # 12 or 24
show_date: true
date_format: MM/DD/YYYY
clock_source: client

# Kiosk behaviour
duration: 30 # in seconds

layout: splitview # single, splitview or splitview-landscape

# Transition options
transition: cross-fade # cross-fade, fade or none

# Image display settings
show_progress_bar: true
image_fit: cover # none, contain, cover
image_effect: smart-zoom

# PhotoPrism: set album UIDs and/or labels to filter (optional)
# albums: []
# tags: []  # labels in PhotoPrism

## Image METADATA
show_album_name: true
show_person_name: true
show_image_time: true
image_time_format: 24
show_image_date: true
image_date_format: YYYY-DD-MM
show_image_description: true
show_image_exif: true
show_image_location: true
show_image_id: false
show_more_info: true
show_more_info_image_link: true
show_more_info_qr_code: true

weather:
  rotation_interval: 10 # in seconds
  locations:
    - name: London
      lat: 51.5285262
      lon: -0.2663999
      api: ""
      unit: metric
      lang: en
      default: true

    - name: New York
      lat: 40.7858335
      lon: -73.9883068
      api: ""
      unit: imperial
      lang: en
      default: false

    - name: Tokyo
      lat: 35.6895
      lon: 139.6917
      api: ""
      unit: metric
      lang: en
      default: false

use_offline_mode: true

offline_mode:
  enabled: true
  number_of_assets: 40
  max_size: 1gb
  expiration_hours: 0

kiosk:
  port: 3000
  http_timeout: -1
  enable_url_builder: true

  redirects:
    - name: curated
      url: /?weather=rotate

    - name: all
      url: /?album=none&use_offline_mode=false

    - name: simple
      url: /?image_effect=none&layout=single&image_fit=contain&transition=none&disable_ui=true&show_more_info=false&use_offline_mode=false

    - name: solid-theme
      url: /?theme=solid&use_offline_mode=false
