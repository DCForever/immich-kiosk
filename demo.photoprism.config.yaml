# Demo-style config for the kiosk with PhotoPrism.
# Use by copying to config.yaml and setting photoprism_url and photoprism_token
# (or set KIOSK_PHOTOPRISM_URL and KIOSK_PHOTOPRISM_TOKEN).
#
#   cp demo.photoprism.config.yaml config.yaml
#   # Edit config.yaml: set photoprism_url and photoprism_token
#   go run .
#
# Or run with demo.config.yaml replaced by this file and KIOSK_DEMO_MODE=1.
# Documentation: https://docs.immichkiosk.app/configuration/

# yaml-language-server: $schema=https://raw.githubusercontent.com/damongolding/immich-kiosk/main/config.schema.json

source: photoprism  # https://docs.immichkiosk.app/configuration/core-required/
photoprism_url: "http://10.0.0.49:2342"   # Your PhotoPrism URL (or set KIOSK_PHOTOPRISM_URL). https://docs.immichkiosk.app/configuration/core-required/
photoprism_token: "73f1b0493ce48f3cd2d2937baa073ba4deb65e04f9d865f4"                      # App password / API token from PhotoPrism Settings → Account (or set KIOSK_PHOTOPRISM_TOKEN). https://docs.immichkiosk.app/configuration/core-required/

# Clock: https://docs.immichkiosk.app/configuration/clock/
show_time: true
time_format: 12 # 12 or 24
show_date: true
date_format: MM/DD/YYYY
clock_source: client

# Kiosk behaviour: https://docs.immichkiosk.app/configuration/behavior/
duration: 30 # in seconds

layout: splitview # single, splitview or splitview-landscape. https://docs.immichkiosk.app/configuration/layouts/

# Transition options: https://docs.immichkiosk.app/configuration/behavior/
transition: cross-fade # cross-fade, fade or none

# Image display: https://docs.immichkiosk.app/configuration/behavior/
show_progress_bar: true
image_fit: cover # none, contain, cover. https://docs.immichkiosk.app/configuration/image-fit/
image_effect: smart-zoom  # https://docs.immichkiosk.app/configuration/image-effects/

# PhotoPrism: set album UIDs and/or labels to filter (optional). https://docs.immichkiosk.app/configuration/albums/ https://docs.immichkiosk.app/configuration/tags/
# albums: []
# tags: []  # labels in PhotoPrism. https://docs.immichkiosk.app/configuration/tags/

## Image METADATA: https://docs.immichkiosk.app/configuration/metadata/
show_album_name: true
show_person_name: true
show_image_time: true
image_time_format: 24
show_image_date: true
image_date_format: YYYY-DD-MM
show_image_description: true
show_image_exif: true
show_image_location: true
show_image_id: false
# More Info Overlay: https://docs.immichkiosk.app/configuration/more-info-overlay/
show_more_info: true
show_more_info_image_link: true
show_more_info_qr_code: true

# Weather: https://docs.immichkiosk.app/configuration/weather/
weather:
  rotation_interval: 10 # in seconds
  locations:
    - name: London
      lat: 51.5285262
      lon: -0.2663999
      api: ""
      unit: metric
      lang: en
      default: true

    - name: New York
      lat: 40.7858335
      lon: -73.9883068
      api: ""
      unit: imperial
      lang: en
      default: false

    - name: Tokyo
      lat: 35.6895
      lon: 139.6917
      api: ""
      unit: metric
      lang: en
      default: false

use_offline_mode: true  # https://docs.immichkiosk.app/configuration/offline-mode/

# Offline mode: https://docs.immichkiosk.app/configuration/offline-mode/
offline_mode:
  enabled: true
  number_of_assets: 40
  max_size: 1gb
  expiration_hours: 0

# Kiosk server: https://docs.immichkiosk.app/configuration/additional-options/ https://docs.immichkiosk.app/configuration/redirects/
kiosk:
  port: 3000
  http_timeout: -1
  enable_url_builder: true  # https://docs.immichkiosk.app/configuration/changing-settings-via-url/

  redirects:
    - name: curated
      url: /?weather=rotate

    - name: all
      url: /?album=none&use_offline_mode=false

    - name: simple
      url: /?image_effect=none&layout=single&image_fit=contain&transition=none&disable_ui=true&show_more_info=false&use_offline_mode=false

    - name: solid-theme
      url: /?theme=solid&use_offline_mode=false
