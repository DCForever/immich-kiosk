# Minimal config for testing the kiosk with PhotoPrism.
# Copy to config.yaml and set photoprism_url and photoprism_token.
#
#   cp config.photoprism.example.yaml config.yaml
#   # Edit config.yaml: set photoprism_url and photoprism_token
#   go run .

source: photoprism
photoprism_url: "http://localhost:2342"
photoprism_token: "your-app-password-or-token"
# Kiosk behaviour
kiosk:
  port: 3000
  debug: false
  enable_url_builder: true  # Optional: use URL builder to pick albums/labels
